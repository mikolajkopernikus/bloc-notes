<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bloc-notes avec table des matières">
    <meta name="theme-color" content="#4CAF50">
    <title>Bloc-Notes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="app">
        <!-- Overlay pour fermer la sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <!-- En-tête -->
        <header class="header">
            <button class="btn-menu" id="toggleSidebar">☰</button>
            <div class="note-label-container">
                <span class="note-label">Note:</span>
                <span class="version-label">v0.3</span>
            </div>
            <input type="text" id="sectionTitle" class="section-title-header" placeholder="Titre">
            <span class="last-modified" id="lastModified"></span>
            <span class="storage-status" id="storageStatus" title="Statut de protection des données"></span>
        </header>

        <!-- Barre latérale - Table des matières -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Table des matières</h2>
                <button class="btn-close" id="closeSidebar">✕</button>
            </div>
            <button class="btn-new-section" id="newSectionBtn">+ Nouvelle note</button>
            <button class="btn-export" id="exportBtn">📥 Exporter la sélection</button>
            <button class="btn-import" id="importBtn">📤 Importer des notes</button>
            <button class="btn-delete" id="deleteSectionBtn">🗑️ Supprimer la sélection</button>
            <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
            <div class="google-drive-section">
                <h3 style="font-size: 14px; margin: 10px 0; color: #666;">Google Drive</h3>
                <button class="btn-google-drive" id="googleDriveSignInBtn">🔑 Se connecter</button>
                <button class="btn-google-drive" id="googleDriveSignOutBtn" style="display:none;">🚪 Déconnexion</button>
                <button class="btn-sync" id="googleDriveSyncBtn" disabled>☁️ Synchroniser</button>
                <button class="btn-restore" id="googleDriveRestoreBtn" disabled>📥 Restaurer</button>
                <div id="syncStatus" class="sync-status"></div>
            </div>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
            <ul class="toc" id="tocList"></ul>
        </aside>

        <!-- Zone d'édition -->
        <main class="editor-container">
            <div class="toolbar">
                <button class="btn-tool" id="boldBtn" title="Gras (Ctrl+B)"><strong>B</strong></button>
                <button class="btn-tool" id="italicBtn" title="Italique (Ctrl+I)"><em>I</em></button>
                <button class="btn-tool" id="underlineBtn" title="Souligné (Ctrl+U)"><u>U</u></button>
                <button class="btn-tool" id="h1Btn" title="Titre (H1) / Normal">H1</button>
                <button class="btn-tool" id="fontIncreaseBtn" title="Augmenter la taille">A+</button>
                <button class="btn-tool" id="fontDecreaseBtn" title="Diminuer la taille">A-</button>
                <button class="btn-tool" id="ulBtn" title="Liste">•</button>
                <button class="btn-tool" id="timestampBtn" title="Insérer date et heure">🕐</button>
            </div>

            <div class="editor" id="editor" contenteditable="true" spellcheck="true">
            </div>
        </main>
    </div>

    <script src="db.js"></script>
    <script src="google-drive-sync.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker enregistré'))
                .catch(err => console.log('Erreur Service Worker:', err));
        }
    </script>
</body>
</html>
